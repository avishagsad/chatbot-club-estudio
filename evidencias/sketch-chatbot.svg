<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title description">
  <title id="title">Sketch del chatbot del club de estudio</title>
  <desc id="description">Propuesta visual cálida y artística para un chatbot guiado por botones.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf6"/><stop offset="1" stop-color="#f3eafb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#624b69" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1440" height="1040" fill="url(#paper)"/>
  <circle cx="1280" cy="105" r="170" fill="#f9d8d1" opacity=".55"/>
  <circle cx="155" cy="860" r="210" fill="#dcd2f2" opacity=".58"/>
  <path d="M72 240c90-48 144 34 215 8s81-92 149-57" fill="none" stroke="#cc8f9f" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round"/>
  <text x="112" y="112" fill="#b46f7c" font-family="Arial,sans-serif" font-size="16" letter-spacing="4">CLUB DE ESTUDIO · IDEA DE INTERFAZ</text>
  <text x="108" y="177" fill="#352a43" font-family="Georgia,serif" font-size="54">Un ratito para ordenar</text>
  <text x="108" y="226" fill="#352a43" font-family="Georgia,serif" font-size="54" font-style="italic">las ideas ✳</text>
  <text x="112" y="273" fill="#766b7c" font-family="Arial,sans-serif" font-size="18">Asistente de bienvenida · conversación por opciones</text>

  <g filter="url(#shadow)">
    <rect x="365" y="318" width="710" height="650" rx="34" fill="#fffdfb"/>
  </g>
  <path d="M399 318h642a34 34 0 0 1 34 34v96H365v-96a34 34 0 0 1 34-34" fill="#e9def4"/>
  <circle cx="414" cy="378" r="25" fill="#fff8f3"/>
  <path d="M405 383c5-12 13-12 18 0M409 371h.1M420 371h.1" stroke="#bd7887" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="455" y="371" fill="#3b2e48" font-family="Georgia,serif" font-size="24">Lila</text>
  <text x="455" y="397" fill="#776984" font-family="Arial,sans-serif" font-size="14">GUÍA DEL CLUB · DISPONIBLE</text>
  <circle cx="1001" cy="378" r="5" fill="#9cbd9a"/>

  <text x="407" y="464" fill="#a288a0" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">HOY, UN PASO A LA VEZ</text>
  <rect x="405" y="483" width="500" height="93" rx="22" fill="#f5eef8"/>
  <path d="M425 555l-11 19 31-12" fill="#f5eef8"/>
  <text x="430" y="520" fill="#463a4e" font-family="Arial,sans-serif" font-size="18">¡Hola! Soy Lila, la guía del club. 🌷</text>
  <text x="430" y="549" fill="#463a4e" font-family="Arial,sans-serif" font-size="18">¿Cómo te llamás?</text>

  <rect x="647" y="596" width="384" height="54" rx="19" fill="#f7d9d1"/>
  <text x="671" y="629" fill="#563e48" font-family="Arial,sans-serif" font-size="17">Avishag</text>
  <rect x="405" y="670" width="540" height="78" rx="22" fill="#f5eef8"/>
  <text x="430" y="703" fill="#463a4e" font-family="Arial,sans-serif" font-size="18">¡Qué lindo tenerte, Avishag! ✨</text>
  <text x="430" y="731" fill="#463a4e" font-family="Arial,sans-serif" font-size="18">¿Qué te gustaría consultar?</text>

  <g font-family="Arial,sans-serif" font-size="16" fill="#51435b">
    <rect x="405" y="777" width="192" height="54" rx="18" fill="#fff" stroke="#d9c9e6" stroke-width="2"/><text x="438" y="811">◷  Horarios</text>
    <rect x="609" y="777" width="192" height="54" rx="18" fill="#fff" stroke="#d9c9e6" stroke-width="2"/><text x="642" y="811">✿  Materias</text>
    <rect x="813" y="777" width="218" height="54" rx="18" fill="#fff" stroke="#d9c9e6" stroke-width="2"/><text x="840" y="811">✎  Técnicas</text>
    <rect x="405" y="845" width="300" height="54" rx="18" fill="#fff" stroke="#d9c9e6" stroke-width="2"/><text x="438" y="879">♡  Contacto</text>
    <rect x="717" y="845" width="314" height="54" rx="18" fill="#bd7887"/><text x="750" y="879" fill="#fff">Cerrar por ahora  ↗</text>
  </g>
  <text x="500" y="934" fill="#aa9aaa" font-family="Arial,sans-serif" font-size="13">LAS RESPUESTAS VUELVEN A ESTE MENÚ · REINICIO DISPONIBLE AL FINAL</text>

  <g font-family="Arial,sans-serif" fill="#715f76" font-size="14">
    <path d="M310 390h45" stroke="#bd7887" stroke-width="2"/><circle cx="310" cy="390" r="5" fill="#bd7887"/><text x="120" y="384">Identidad cálida</text><text x="120" y="405">y bienvenida</text>
    <path d="M1075 590h74" stroke="#bd7887" stroke-width="2"/><circle cx="1075" cy="590" r="5" fill="#bd7887"/><text x="1165" y="584">El nombre se</text><text x="1165" y="605">recuerda y reutiliza</text>
    <path d="M1075 805h74" stroke="#bd7887" stroke-width="2"/><circle cx="1075" cy="805" r="5" fill="#bd7887"/><text x="1165" y="799">Opciones guiadas</text><text x="1165" y="820">sin texto libre</text>
  </g>
  <text x="111" y="979" fill="#a288a0" font-family="Arial,sans-serif" font-size="14" letter-spacing="1">LAVANDA · ROSA EMPOLVADO · CORAL SUAVE</text>
  <text x="1210" y="979" fill="#a288a0" font-family="Georgia,serif" font-size="18" font-style="italic">boceto 01</text>
</svg>
